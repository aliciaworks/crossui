name: CrossUI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Kotlin build and generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build verifySourceFileSize
      - name: Build independent KMP Android consumer
        run: ./gradlew integrationTestExistingKmp
      - name: Verify generated native source is current
        run: |
          ./gradlew generateNativeUi
          git diff --exit-code -- hosts

  winui:
    name: Generated WinUI compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Generate typed XAML and C# adapters
        run: .\gradlew.bat generateNativeUi
      - name: Compile generated WinUI controls
        run: dotnet build .\hosts\windows\CrossUi.Windows.csproj

  apple:
    name: Apple KMP and Swift 6.4 generation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Apple settings adapter
        run: |
          ./gradlew :runtime:compileKotlinIosSimulatorArm64 \
            :ui-dsl:compileKotlinIosSimulatorArm64 \
            :ui-ir:compileKotlinIosSimulatorArm64
      - name: Generate SwiftUI source
        run: ./gradlew generateNativeUi
      - name: Type-check generated Swift with strict concurrency
        run: |
          xcrun swiftc \
            -swift-version 6 \
            -strict-concurrency=complete \
            -warnings-as-errors \
            -typecheck \
            hosts/ios/StrictConcurrencyFixture.swift \
            hosts/ios/generated/CrossUiShowcase.swift \
            hosts/ios/generated/CrossUiTypedFixture.swift
      - name: Verify generated Apple source is current
        run: git diff --exit-code -- hosts/ios hosts/crossui-map.json
