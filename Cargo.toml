[workspace]
resolver = "3"
members = [
  "crates/crossui-ir",
  "crates/crossui-dsl",
  "crates/crossui-core",
  "crates/crossui-android",
  "crates/crossui-ffi",
  "crates/crossui-testing",
  "crates/crossui-export",
  "examples/showcase",
  "examples/login-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/crossdesign"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
jni = "0.21"
