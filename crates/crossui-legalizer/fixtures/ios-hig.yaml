# iOS HIG rule pack – v0.1.0

rules:
  - id: ios.destructive-confirmation
    applies_to:
      platform: ios
    when:
      - field: node_kind
        equals: button
    result:
      legality: warning
      message: "Destructive actions should present a confirmation sheet on iOS."
    rewrites:
      - confirmation_sheet

  - id: ios.glanceable-content
    applies_to:
      platform: ios
    when:
      - field: glanceable
        equals: true
    result:
      legality: info
      message: "iOS apps are not glanceable; consider a widget for at-a-glance content."

  - id: ios.minimum-tap-target
    applies_to:
      platform: ios
    when:
      - field: node_kind
        equals: button
    result:
      legality: warning
      message: "Buttons must have a minimum tap target of 44×44 points per iOS HIG."

  - id: ios.swipe-back-gesture
    applies_to:
      platform: ios
    when:
      - field: node_kind
        equals: navigation
    result:
      legality: info
      message: "iOS users expect swipe-back gesture on navigation stacks."

  - id: ios.keyboard-avoidance
    applies_to:
      platform: ios
    when:
      - field: node_kind
        equals: input
    result:
      legality: info
      message: "Ensure input fields scroll above the keyboard using keyboardLayoutGuide."
