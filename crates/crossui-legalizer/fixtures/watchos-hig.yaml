# watchOS HIG rule pack – v0.1.0
#
# Each rule is a small, auditable asset.  Rules are validated
# against fixture tests in CI.  See legalizer README for format.

rules:
  - id: watchos.data-table-density
    applies_to:
      platform: watchos
    when:
      - field: columns
        greater_than: 3
    result:
      legality: illegal
      message: "Layouts with >3 columns are unsuitable for wrist interaction."
    rewrites:
      - summary_and_drilldown
      - top_metrics_only
      - handoff_to_iphone

  - id: watchos.glanceable-brief-interaction
    applies_to:
      platform: watchos
    when:
      - field: glanceable
        equals: true
      - field: interaction_duration
        equals: brief
    result:
      legality: warning
      message: "Glanceable apps should avoid long scrollable lists. Prefer top-k metrics."

  - id: macos.keyboard-accessibility
    applies_to:
      platform: macos
    when:
      - field: node_kind
        equals: button
    result:
      legality: warning
      message: "Consider assigning a keyboard shortcut to frequently-used actions."

  - id: ios.destructive-confirmation
    applies_to:
      platform: ios
    when:
      - field: node_kind
        equals: button
    result:
      legality: info
      message: "Destructive actions on iOS should include a confirmation sheet."
