name: Synchronize Crowdin translations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "localization/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload sources and open a translation pull request
        uses: crowdin/github-action@v2
        with:
          config: examples/localization/crowdin/crowdin.yml
          upload_sources: true
          upload_translations: false
          download_translations: true
          localization_branch_name: l10n/crowdin
          create_pull_request: true
          pull_request_title: Update translations from Crowdin
          pull_request_base_branch_name: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

